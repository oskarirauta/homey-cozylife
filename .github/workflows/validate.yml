name: Validate Homey App

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  validate:
    name: Validate Homey App
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Install musl sharp binary for Alpine Docker action
        run: npm install --no-save --os=linux --libc=musl --cpu=x64 sharp
      - uses: athombv/github-action-homey-app-validate@master
        with:
          level: verified
